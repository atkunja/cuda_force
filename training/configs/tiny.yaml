# Smallest runnable configuration.
#
# Needs no GPU and no network access beyond the base model: the corpus is
# inline. This is what CI runs and what a reader should try first to confirm
# the pipeline works before pointing it at anything expensive.

model_name: sshleifer/tiny-gpt2
output_dir: checkpoints/tiny

inline_texts:
  - "CUDA threads are grouped into warps of 32 that execute in lockstep."
  - "Shared memory is on-chip and roughly an order of magnitude faster than global memory."
  - "Coalesced access lets the hardware merge adjacent thread requests into one transaction."
  - "A condition variable parks a thread until another thread signals a state change."
  - "Dynamic batching amortises weight loading across concurrent requests."
  - "CUDA streams allow copy and compute to overlap on separate hardware engines."
  - "Pinned host memory is required for a transfer to overlap with kernel execution."
  - "LoRA freezes the base weights and trains a low-rank update in their place."

max_seq_length: 64
batch_size: 2
gradient_accumulation_steps: 1
learning_rate: 0.001
epochs: 2
seed: 42

mixed_precision: false
gradient_checkpointing: false

logging_steps: 2

lora:
  rank: 4
  alpha: 8
  dropout: 0.0
  target_modules: ["c_attn"]
