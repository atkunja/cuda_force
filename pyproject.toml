[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cudaforge"
version = "0.1.0"
description = "GPU-native LLM fine-tuning and concurrent inference runtime"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Ayush Kunjadia" }]
keywords = ["cuda", "llm", "inference", "lora", "gpu", "batching"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "License :: OSI Approved :: MIT License",
]

# torch is the only hard runtime dependency. Everything needed exclusively for
# fine-tuning or serving lives in an extra, so importing cudaforge to use the
# operators does not drag in transformers, datasets and a web server.
dependencies = ["torch>=2.1", "numpy>=1.24"]

[project.optional-dependencies]
train = [
  "transformers>=4.40",
  "peft>=0.11",
  "datasets>=2.19",
  "accelerate>=0.30",
  "pyyaml>=6.0",
]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]
# bitsandbytes is Linux/CUDA only, which is why QLoRA is its own extra rather
# than part of `train`: installing `train` must not fail on macOS.
quantize = ["bitsandbytes>=0.43; platform_system == 'Linux'"]
dev = [
  "pytest>=8.0",
  "pytest-timeout>=2.3",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.urls]
Repository = "https://github.com/atkunja/cuda_force"

[project.scripts]
cudaforge-serve = "cudaforge.cli:serve"
cudaforge-bench = "cudaforge.cli:bench"

# All three are installed packages, not just `cudaforge`.
#
# `cudaforge-serve` starts uvicorn with the import string
# "inference.server:app", so `inference` has to be importable from an installed
# wheel, not merely from a checkout. Leaving it out made the entry point work
# only when the current directory happened to be the repository root — which is
# also why a bare `pytest` failed while `python -m pytest` passed.
[tool.setuptools]
packages = ["cudaforge", "inference", "training"]

[tool.setuptools.package-dir]
cudaforge = "python/cudaforge"
inference = "inference"
training = "training"

# The YAML configs are referenced by path from the docs and by the serve entry
# point, so they ship with the package rather than only existing in a checkout.
[tool.setuptools.package-data]
inference = ["configs/*.yaml"]
training = ["configs/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["python", "training", "inference", "benchmarks", "examples", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "F",    # pyflakes
  "I",    # import sorting
  "UP",   # pyupgrade
  "B",    # bugbear
  "SIM",  # simplify
  "BLE",  # blind excepts — each one must be justified at the site
  "RUF",
  "ANN",  # missing annotations
]
ignore = [
  "ANN401",  # Any is occasionally the honest annotation for **kwargs
  "B008",    # FastAPI's Depends() default is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on concrete values; annotating every fixture adds noise without
# adding safety.
"tests/**" = ["ANN"]

[tool.mypy]
# python_version is deliberately unset so mypy targets the interpreter it runs
# under. Pinning it to the package's 3.10 floor makes mypy reject the bundled
# numpy stubs, which use 3.12-only `type` statements — the checker fails before
# it reaches any first-party code. CI runs mypy on the oldest supported
# interpreter instead, which gives the same coverage without the conflict.
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
files = ["python/cudaforge"]

[[tool.mypy.overrides]]
# These ship without type information, or with stubs too incomplete to be
# useful. Silencing them here is narrower than a blanket ignore_errors.
module = ["torch.*", "transformers.*", "peft.*", "datasets.*", "bitsandbytes.*", "yaml.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["python/cudaforge", "inference", "training"]
branch = true

[tool.coverage.report]
# No fail-under threshold. A number that must not drop invites tests written to
# raise it rather than to catch anything, and the paths that stay uncovered here
# are deliberate: they need a GPU, a model download, or a missing dependency.
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra --strict-markers --timeout=120"
markers = [
  "cuda: requires an NVIDIA GPU; skipped automatically when none is present",
  "slow: excluded from the default CI run",
]
