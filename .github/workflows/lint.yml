name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,train,serve]"

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: Documentation links
        run: python scripts/check_docs.py .

      - name: Documented file paths
        run: python scripts/check_references.py .

      - name: mypy
        # Run on the oldest supported interpreter. pyproject leaves
        # python_version unset for exactly this reason: pinning it to 3.10 makes
        # mypy reject the bundled numpy stubs, which use 3.12-only syntax.
        run: mypy

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install clang-format
        # From pip rather than apt: the pinned wheel is the same binary
        # everywhere, whereas the distro package moves with the runner image.
        run: pip install "clang-format==20.1.7"

      - name: clang-format
        run: |
          find cpp cuda tests benchmarks \
            \( -name '*.cpp' -o -name '*.hpp' -o -name '*.cu' -o -name '*.cuh' \) \
            -exec clang-format --dry-run --Werror {} +

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh
